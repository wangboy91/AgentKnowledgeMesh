# Docker Compose for PostgreSQL mode
# Usage: docker compose -f docker-compose.pg.yml up -d

services:
  agentvault:
    build: .
    container_name: agentvault
    ports:
      - "8000:8000"
    volumes:
      - ${KNOWLEDGE_DIR:-~/Knowledge}:/knowledge:ro
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - AV_KNOWLEDGE_ROOT=/knowledge
      - AV_DB_TYPE=postgres
      - AV_DB_HOST=postgres
      - AV_DB_PORT=5432
      - AV_DB_NAME=agentvault
      - AV_DB_USER=postgres
      - AV_DB_PASSWORD=${POSTGRES_PASSWORD:-agentvault}
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: agentvault-postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=agentvault
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-agentvault}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
