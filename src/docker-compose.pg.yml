# ⚠️ 仓内 dev 遗留配置(配置已落后于部署版:无管理员账号变量等)。
# 部署/自建镜像请用 deploy/ 的部署 compose + 源码构建叠加文件:
#   docker compose -f deploy/docker-compose.pg.yml -f deploy/docker-compose.build.yml up -d --build
# 见 docs/deployment.md §1.8。本文件仅保留给 make docker-up-pg 等既有开发习惯。

# Docker Compose for PostgreSQL mode
# Usage: docker compose -f docker-compose.pg.yml up -d

services:
  akm-hub:
    build: .
    container_name: akm-hub
    ports:
      - "8000:8000"
    volumes:
      - ${KNOWLEDGE_DIR:-~/Knowledge}:/knowledge:ro
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - AKM_KNOWLEDGE_ROOTS=/knowledge
      - AKM_DB_TYPE=postgres
      - AKM_DB_HOST=postgres
      - AKM_DB_PORT=5432
      - AKM_DB_NAME=agentvault
      - AKM_DB_USER=postgres
      - AKM_DB_PASSWORD=${POSTGRES_PASSWORD:-agentvault}
      # 向量嵌入默认 ark,密钥从本地 .env 透传(镜像内无 .env)
      # local 模式是可选依赖:自建镜像需在 Dockerfile 的 uv sync 加 --extra local-embedding
      - AKM_EMBEDDING_PROVIDER=${AKM_EMBEDDING_PROVIDER:-ark}
      - AKM_EMBEDDING_MODEL=${AKM_EMBEDDING_MODEL:-doubao-embedding-vision-250615}
      - AKM_ARK_API_KEY=${AKM_ARK_API_KEY:-}
      - AKM_ARK_BASE_URL=${AKM_ARK_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg18
    container_name: akm-postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=agentvault
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-agentvault}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
