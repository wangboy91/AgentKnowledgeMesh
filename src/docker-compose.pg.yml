# Docker Compose for PostgreSQL mode
# Usage: docker compose -f docker-compose.pg.yml up -d

services:
  akm-hub:
    build: .
    container_name: akm-hub
    ports:
      - "8000:8000"
    volumes:
      - ${KNOWLEDGE_DIR:-~/Knowledge}:/knowledge:ro
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - AKM_KNOWLEDGE_ROOTS=/knowledge
      - AKM_DB_TYPE=postgres
      - AKM_DB_HOST=postgres
      - AKM_DB_PORT=5432
      - AKM_DB_NAME=agentvault
      - AKM_DB_USER=postgres
      - AKM_DB_PASSWORD=${POSTGRES_PASSWORD:-agentvault}
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: akm-postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=agentvault
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-agentvault}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
