[project]
name = "akm-node"
version = "0.2.0"
description = "AgentKnowledgeMesh Node Client"
requires-python = ">=3.11"
dependencies = [
    "websockets>=12.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",
    "akm-shared",
]

[project.scripts]
akm-node = "app.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.sources]
akm-shared = { path = "../shared" }
