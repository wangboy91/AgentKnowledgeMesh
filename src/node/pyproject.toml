[project]
name = "akm-node"
version = "0.2.0"
license = { text = "MIT" }
description = "AgentKnowledgeMesh Node Client"
requires-python = ">=3.11"
dependencies = [
    "websockets>=12.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",
    "mcp>=1.0.0",
    "akm-shared>=0.2.0",
]

[project.scripts]
akm-node = "app.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.sources]
akm-shared = { path = "../shared" }
