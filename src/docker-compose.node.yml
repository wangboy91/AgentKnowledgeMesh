# Docker Compose for Node client
# Usage: docker compose -f docker-compose.node.yml up -d

services:
  akm-node:
    build:
      context: .
      dockerfile: Dockerfile.node
    container_name: akm-node
    environment:
      - AKM_HUB_URL=ws://host.docker.internal:8000/ws
      - AKM_HUB_API_URL=http://host.docker.internal:8000/api
      - AKM_NODE_NAME=MyDockerNode
      - AKM_KNOWLEDGE_ROOTS=/knowledge
    volumes:
      - ${KNOWLEDGE_DIR:-~/Knowledge}:/knowledge:ro
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
