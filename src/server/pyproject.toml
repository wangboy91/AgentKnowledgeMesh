[project]
name = "akm-server"
version = "0.1.0"
description = "AgentKnowledgeMesh - Distributed Knowledge OS for AI Agents"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "aiosqlite>=0.20.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "mcp>=1.0.0",
    "psycopg2-binary>=2.9.9",
    "httpx>=0.27.0",
    "PyJWT>=2.9.0",
    "sentence-transformers>=2.0.0",
    "pymupdf4llm>=0.0.5",
    "python-docx>=0.8.11",
    "beautifulsoup4>=4.12.0",
    "asyncpg>=0.31.0",
    "akm-shared",
]

[tool.uv.sources]
akm-shared = { path = "../shared" }

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[project.scripts]
# uv 管理的启动入口:
#   uv run akm-hub        -> Web 服务
#   uv run akm-hub --mcp  -> MCP Server stdio 模式
akm-hub = "app.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
