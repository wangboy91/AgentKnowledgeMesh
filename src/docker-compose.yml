services:
  # Main application (SQLite mode - default)
  agentvault:
    build: .
    container_name: agentvault
    ports:
      - "8000:8000"
    volumes:
      # 挂载本地知识库目录（修改为你的实际路径）
      - ${KNOWLEDGE_DIR:-~/Knowledge}:/knowledge:ro
      # 持久化数据库
      - agentvault-data:/app/data
    environment:
      - AV_KNOWLEDGE_ROOT=/knowledge
      - AV_DB_TYPE=sqlite
      - AV_DB_PATH=/app/data/agentvault.db
    restart: unless-stopped

